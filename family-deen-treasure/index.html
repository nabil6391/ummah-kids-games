<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <link rel="icon" href="data:," />
  <title>Quran Treasure Hunt · Family Deen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Amiri+Quran&family=Amiri:wght@400;700&display=swap" />
  <script type="module" crossorigin src="./assets/index-BeKcPrna.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Bn7kxnnC.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="paper"></div>
  <div id="labels"></div>

  <div id="hud" class="hidden">
    <div class="hud-left">
      <div class="pill" id="huntPill"><span id="huntEmoji">📜</span><b id="huntName">Surah Hunt</b><span class="talks" title="Conversations had">💬 <b id="talkCount">0</b></span></div>
      <div class="pieces" id="pieces"></div>
    </div>
    <div class="hud-right">
      <button class="icon-btn dk-iconbtn" data-act="surahs" aria-label="Surah list helper" title="Surah list helper"><span class="dk-ico"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 48l24-16 24 16-24 10z" fill="#c98a4d"/><path d="M14 30q18-8 18 0v14q0-8-18 0z" fill="#fffaf0"/><path d="M50 30q-18-8-18 0v14q0-8 18 0z" fill="#fffaf0"/></svg></span></button>
      <button class="icon-btn dk-iconbtn" data-act="map" aria-label="Treasure map" title="Treasure map"><span class="dk-ico"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"><path d="M8 16l16-6 16 6 16-6v38l-16 6-16-6-16 6z" fill="#e9d6a8"/><path d="M24 10v38M40 16v38" stroke-width="2.4"/><path d="M44 24l6 6M50 24l-6 6" stroke="#ea5d50" stroke-width="3"/></svg></span></button>
      <button class="icon-btn" data-act="mute" id="muteBtn" aria-label="Sound on or off" title="Sound">🔊</button>
      <button class="icon-btn" data-act="home" aria-label="Back to the maps" title="Back to the maps">⌂</button>
    </div>
    <div class="rot"><button data-act="rotL" aria-label="Turn left">⟲</button><button data-act="rotR" aria-label="Turn right">⟳</button></div>
  </div>

  <aside id="panel" class="hidden"></aside>
  <section id="overlay" class="screen hidden"></section>
  <section id="surahModal" class="screen hidden">
    <div class="frame surah-frame">
      <div class="ribbon">📖 Surah list helper</div>
      <p class="helper-note">All 114 surahs, in mushaf order. Use this to find your way in your mushaf. The answers are in your Qur'an, not here!</p>
      <input id="surahSearch" type="search" placeholder="Type a name or number…" autocomplete="off" />
      <div class="surah-list" id="surahList"></div>
      <button class="btn" data-act="closeSurahs">Close</button>
    </div>
  </section>
  <div id="flyLayer"></div>

<script src="../site-extras.js" defer></script>
</body>
</html>
